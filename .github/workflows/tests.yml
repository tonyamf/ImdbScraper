name: tests
on:
  push:
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install scrapy==2.19.0 pandas==3.0.6 numpy==2.4.6 pytest
      - run: python -m pytest -v
